spring.application.name=expense-tracker-backend
server.port=${PORT:8080}

# تقليل خيوط Tomcat لتوفير الذاكرة ومنع OutOfMemoryError في Render
server.tomcat.threads.max=15
server.tomcat.threads.min-spare=2

# إعدادات الاتصال بقاعدة بيانات Neon PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:omar738512}

# ضبط حوض الاتصالات مع Neon
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# إعدادات التوكن (30 يوماً)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=2592000000

# إعدادات البريد الاختيارية
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${SENDER_EMAIL:omaralarashi090@gmail.com}
spring.application.name=expense-tracker-backend
server.port=${PORT:8080}

# الاتصال بقاعدة البيانات (يقرأ من Render إن وجد، وإلا يستخدم جهازك المحلي)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:omar738512}

# ضبط حوض الاتصالات لتوفير الذاكرة في استضافة Render المجانية
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# تسريع عمليات المزامنة المتعددة (Batching) في PostgreSQL
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


spring.application.name=expense-tracker-backend
server.port=${PORT:8080}

# إذا كنا في السحابة سيقرأ DB_URL، وإذا كنا على اللابتوب سيستخدم localhost تلقائياً
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:omar738512}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# تسريع PostgreSQL أثناء المزامنة
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

